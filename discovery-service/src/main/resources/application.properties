
# The name of this microservice - used by Eureka, Config Server, and logs
spring.application.name=discovery-service

# Port this service listens on -8761 is the default conventional port for Eureka
server.port=8761

# Prevents this Eureka server from fetching the registry from another Eureka instance
# (it IS the registry - no need to fetch from itself)
eureka.client.fetch-registry=false

# Prevents this Eureka server from registering itself as a client
# (it IS the server - it doesn't need to register with itself)
eureka.client.register-with-eureka=false
