# The name of this microservice - used by Eureka, Config Server, and logs
spring.application.name=customer-service

# Port this service listens on (each microservice should have a unique port)
server.port=8081

# Enables fetching externalized configuration from a Spring Cloud Config Server
spring.cloud.config.enabled=true

# Imports config from the Config Server at the given URL
# "optional:" means the app still starts even if the Config Server is unreachable
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}